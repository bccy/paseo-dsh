<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>鹈鹕骑自行车 · SVG 2D 动画</title>
<style>
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 24px;
    background: radial-gradient(120% 120% at 50% 0%, #f6fcff 0%, #e4f0f6 45%, #cfdfe8 100%);
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", -apple-system, "Segoe UI", sans-serif;
    color: #223841;
  }
  .stage { width: min(100%, 1000px); }
  .title {
    display: flex;
    align-items: baseline;
    gap: 12px;
    flex-wrap: wrap;
    padding: 0 8px 12px;
  }
  .title h1 {
    margin: 0;
    font-size: clamp(19px, 2.4vw, 27px);
    font-weight: 700;
    letter-spacing: 0.08em;
  }
  .title p {
    margin: 0;
    font-size: clamp(11px, 1.3vw, 13px);
    color: #6b8794;
    letter-spacing: 0.2em;
    text-transform: uppercase;
  }
  .frame {
    border-radius: 26px;
    overflow: hidden;
    background: #dff2ff;
    box-shadow: 0 26px 60px -22px rgba(28, 66, 86, 0.5),
                0 1px 0 rgba(255, 255, 255, 0.8) inset;
  }
  .frame svg { display: block; width: 100%; height: auto; }
  .caption {
    margin: 12px 4px 0;
    text-align: right;
    font-size: 11.5px;
    letter-spacing: 0.14em;
    color: #7d97a4;
  }
</style>
</head>

                   values="323.9;343.5;352.6;351.4;345.5;332.4;313.1;308.4;323.9"/>

        <!-- ========== 鹈鹕 ========== -->
        <g>

          <g>
            <animateTransform attributeName="transform" type="rotate"

          <ellipse cx="398" cy="222" rx="76" ry="62" fill="url(#bodyGrad)" transform="rotate(-7 398 222)"/>

          <!-- 臀部绒毛（盖住腿根） -->

            <!-- 围巾飘带（在头之前，压在背上） -->
            <g transform="translate(458 166)">
              <g>
                <animateTransform attributeName="transform" type="rotate"

              <g>
                <animateTransform attributeName="transform" type="scale"
                                  values="1 1; 1.02 0.97; 1 1" dur="0.8s" repeatCount="indefinite"/>
                <path transform="translate(-570 -137)"

                <path transform="translate(-570 -137)"
                      d="M 580 148 C 588 176 610 192 636 188" stroke="#e3a94e" stroke-width="2"
                      fill="none" opacity="0.6" stroke-linecap="round"/>

            </g>

            <!-- 围巾环 + 结 -->
            <ellipse cx="472" cy="152" rx="25" ry="10" transform="rotate(51 472 152)" fill="#d94f4f"/>
            <ellipse cx="472" cy="152" rx="25" ry="10" transform="rotate(51 472 152)"
                     fill="none" stroke="#b93c3c" stroke-width="2" opacity="0.7"/>
            <circle cx="458" cy="166" r="9" fill="#c74444"/>

          <!-- 近侧翅膀（握着车把） -->
          <g>
            <animateTransform attributeName="transform" type="rotate"
                              values="0 424 196; -2.2 424 196; 0 424 196" dur="1.6s" repeatCount="indefinite"/>
            <path d="M 424 182 C 466 188 508 210 544 238 L 556 248
                     C 548 260 528 262 510 254 C 480 242 448 236 422 230
                     C 410 214 412 196 424 182 Z" fill="#fbfaf6"/>
            <path d="M 452 198 C 484 212 512 228 536 244" stroke="#e2e6ea" stroke-width="2.5"
                  fill="none" stroke-linecap="round"/>
            <path d="M 444 210 C 476 224 502 238 522 250" stroke="#e2e6ea" stroke-width="2.5"
                  fill="none" stroke-linecap="round"/>
            <path d="M 436 222 C 464 234 486 244 504 252" stroke="#e2e6ea" stroke-width="2.5"
                  fill="none" stroke-linecap="round"/>
            <path d="M 534 238 C 546 240 554 245 557 249 C 549 256 537 257 528 253 Z" fill="#d5dbe2"/>
          </g>
        </g>
      </g>

      <!-- ================= 前景：飘落的叶子 ================= -->
      <g transform="translate(1000 505)">
        <g>
          <animateTransform attributeName="transform" type="translate" dur="9s" begin="-3s"
                            repeatCount="indefinite"
                            values="0 0; -270 -16; -540 12; -810 -10; -1080 0"/>
          <g>

      <!-- ================= 暗角 ================= -->
      <rect x="0" y="0" width="900" height="560" fill="url(#vignette)" pointer-events="none"/>
