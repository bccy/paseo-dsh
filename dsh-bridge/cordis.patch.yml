# The Paseo bridge bundle patch: an automation-only stdio surface over dsh-base.
#
# Stdout carries protocol frames only. This patch must never enable a stdout
# logger. It mirrors the shipped sdk-app/acp-app bundles so the same base
# adapters, tools, persistence and policy apply.

- id: system-prompt
  config:
    personaSuffix: Your working directory is {{cwd}}.
    personaPrefix: >-
      You are a coding agent powered by the {{model}} model.

- id: session-title-llm
  disabled: true

- insert:
    - id: paseo-bridge
      name: 'dsh-paseo-bridge'
      inject: [cmdlineArgs, agents]

- id: hmr
  disabled: true

# The question surface is opt-in per preset in the shipped bundles; the bridge
# needs the model-facing tool mounted so the model can actually ask.
- insert:
    - id: tool-ask-user
      name: '@deepseek-ai/dsh-tool-ask-user'

    # The Workspace registry owns DSH's native session archive set:
    # `archiveSession` / `unarchiveSession` write `archivedSessionIds`. Paseo's
    # archive action is translated onto it (the way Paseo's opencode adapter
    # translates onto `setNativeSessionArchived`), and the import list plus the
    # subagent replay read it to hide archived sessions — so the bridge must
    # compose the same row the web bundle does. Without it every archive request
    # failed with "this DSH runtime composes no workspace registry".
    - id: workspace
      name: '@deepseek-ai/dsh-workspace'
