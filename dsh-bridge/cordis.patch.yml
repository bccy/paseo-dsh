# The Paseo bridge bundle patch: an automation-only stdio surface over dsh-base.
#
# Stdout carries protocol frames only. This patch must never enable a stdout
# logger. It mirrors the shipped sdk-app/acp-app bundles so the same base
# adapters, tools, persistence and policy apply.

- id: system-prompt
  config:
    # DSH 0.2.1 registers only `provider` and `model` as prompt variables;
    # `{{cwd}}` is no longer one, and referencing it fails every turn with
    # `unknown prompt variable "{{cwd}}"`. The model learns its cwd from the
    # runtime context / shell instead.
    personaPrefix: >-
      You are a coding agent powered by the {{model}} model.

- id: session-title-llm
  disabled: true

- insert:
    - id: paseo-bridge
      name: 'dsh-paseo-bridge'
      inject: [cmdlineArgs, agents]

- id: hmr
  disabled: true

# The question surface is opt-in per preset in the shipped bundles; the bridge
# needs the model-facing tool mounted so the model can actually ask.
- insert:
    - id: tool-ask-user
      name: '@deepseek-ai/dsh-tool-ask-user'
